<!DOCTYPE html>
<html lang="en"><head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Explore fantasy, science fiction, and mystery at Quest &amp; Quill, a fictional bookstore.">
  <title>Quest &amp; Quill | User Signup</title>

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="bootstrap-exercise.css">
</head>
<body class="d-flex flex-column min-vh-100">
  <a class="visually-hidden-focusable p-3" href="#signup">Skip to content</a>
  <nav class="navbar navbar-expand-md" data-bs-theme="dark" aria-label="Main navigation">
    <div class="container">
      <a class="navbar-brand fw-bold" href="storefront.html#home">Quest &amp; Quill</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNavigation" aria-controls="mainNavigation" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="mainNavigation">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item"><a class="nav-link" href="storefront.html#home">Home</a></li>
          <li class="nav-item"><a class="nav-link" href="storefront.html#about">About Us</a></li>
          <li class="nav-item"><a class="nav-link" href="storefront.html#images">Images</a></li>
          <li class="nav-item"><a class="nav-link" href="storefront.html#contact">Contact</a></li>
          <li class="nav-item"><a class="nav-link active" href="signup.html" aria-current="page">Sign Up</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <header class="jumbotron py-4 border-bottom">
    <div class="container">
      <h1 class="h2 fw-bold">Quest &amp; Quill Bookstore</h1>
      <p class="mb-0">Your next adventure starts with a page.</p>
    </div>
  </header>
  <main id="signup" class="container flex-grow-1 py-5">
    <div class="row justify-content-center">
      <div class="col-md-8 col-lg-6">
        <h2 class="mb-4">User Signup</h2>
        <form id="signup-form">
          <div class="mb-3">
            <label class="form-label" for="username">Username:</label>
            <input class="form-control" type="text" id="username" name="username" placeholder="Enter username" autocomplete="username" required>
          </div>
          <div class="mb-3">
            <label class="form-label" for="email">Email:</label>
            <input class="form-control" type="email" id="email" name="email" placeholder="Enter email" autocomplete="email" required>
          </div>
          <div class="mb-3">
            <label class="form-label" for="password">Password:</label>
            <input class="form-control" type="password" id="password" name="password" placeholder="Enter password" autocomplete="new-password" required>
          </div>
          <div class="mb-4">
            <label class="form-label" for="confirm-password">Confirm Password:</label>
            <input class="form-control" type="password" id="confirm-password" name="confirm-password" placeholder="Confirm password" autocomplete="new-password" required>
          </div>
          <div class="d-flex gap-2">
            <button class="btn btn-primary" type="submit">Sign Up</button>
            <button class="btn btn-outline-primary" type="reset">Clear Form</button>
          </div>
          <p id="signup-status" class="mt-3 mb-0" role="status" aria-live="polite"></p>
        </form>
      </div>
    </div>
  </main>
  <footer class="py-4 mt-auto text-white">
    <div class="container d-md-flex justify-content-between gap-3">
      <p class="mb-2 mb-md-0">Quest &amp; Quill Bookstore<br><span class="small">1600 Woodland Rd, Abington, PA</span></p>
      <p class="small mb-0">Copyright © 2026 · Quest &amp; Quill</p>
    </div>
  </footer>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>


  <script src="signup.js"></script>
</body></html>
